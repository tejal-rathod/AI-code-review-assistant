name: AI SAST + SCA Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION:      ap-south-1
  ECR_REPOSITORY:  sast-ml-scanner-repo
  LAMBDA_FUNCTION: sast-ml-scanner-fn

permissions:
  contents:      read
  issues:        write
  pull-requests: write

jobs:

  # ════════════════════════════════════════════════════════
  # JOB 1 — Build & deploy updated Lambda image
  # ════════════════════════════════════════════════════════
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -e
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker build -t "${IMAGE_URI}" ./api
          docker push "${IMAGE_URI}"
          docker tag "${IMAGE_URI}" "${LATEST}"
          docker push "${LATEST}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function
        run: |
          set -e
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION}" \
            --image-uri "${{ steps.build.outputs.image_uri }}"
          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION}"

  # ════════════════════════════════════════════════════════
  # JOB 2 — SAST scan changed Java files
  # ════════════════════════════════════════════════════════
  sast-scan:
    name: SAST — Scan Java Files
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents:      read
      issues:        write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Get changed Java files
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep '\.java$' > sast_files.txt || true
          else
            git diff --name-only HEAD~1 HEAD \
              | grep '\.java$' > sast_files.txt || true
          fi
          echo "Changed Java files:"
          cat sast_files.txt || true
          echo "count=$(wc -l < sast_files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Scan each Java file via Lambda
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          mkdir -p sast_reports
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue
            echo "SAST scanning: $file"
            CONTENT=$(jq -Rs . < "$file")
            PAYLOAD=$(jq -n \
              --arg fn "$file" \
              --argjson content "$CONTENT" \
              '{mode:"file", filename:$fn, content:$content}')
            aws lambda invoke \
              --function-name "${LAMBDA_FUNCTION}" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              "sast_reports/$(basename "$file").json"
            echo "Response:"
            cat "sast_reports/$(basename "$file").json"
            CRITICAL=$(jq -r '.body | fromjson | .has_critical' \
              "sast_reports/$(basename "$file").json" 2>/dev/null || echo "false")
            [ "$CRITICAL" = "true" ] && FAIL=1
          done < sast_files.txt
          exit $FAIL

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: sast_reports/
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════
  # JOB 3 — SCA scan pom.xml via NVD
  # ════════════════════════════════════════════════════════
  sca-scan:
    name: SCA — Scan pom.xml Dependencies
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents:      read
      issues:        write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Find pom.xml files
        id: pom
        shell: bash
        run: |
          find . -name "pom.xml" \
            -not -path "./.git/*" \
            -not -path "*/target/*" > pom_files.txt || true
          echo "Found pom.xml files:"
          cat pom_files.txt
          echo "count=$(wc -l < pom_files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Scan each pom.xml via Lambda (NVD)
        if: steps.pom.outputs.count != '0'
        shell: bash
        run: |
          mkdir -p sca_reports
          while IFS= read -r pom; do
            [ -z "$pom" ] && continue
            [ -f "$pom" ] || continue
            echo "SCA scanning: $pom"
            CONTENT=$(jq -Rs . < "$pom")
            PAYLOAD=$(jq -n \
              --arg fn "$pom" \
              --argjson content "$CONTENT" \
              '{mode:"sca", filename:$fn, content:$content}')
            SAFE_NAME=$(echo "$pom" | tr '/' '_' | sed 's/^_//')
            aws lambda invoke \
              --function-name "${LAMBDA_FUNCTION}" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              "sca_reports/${SAFE_NAME}.json"
            echo "SCA Response:"
            cat "sca_reports/${SAFE_NAME}.json"
          done < pom_files.txt

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: sca_reports/
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════
  # JOB 4 — Post combined SAST + SCA comment on PR
  # ════════════════════════════════════════════════════════
  post-pr-comment:
    name: Post PR Comment
    needs: [sast-scan, sca-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && always()
    permissions:
      contents:      read
      issues:        write
      pull-requests: write

    steps:
      - name: Download SAST reports
        uses: actions/download-artifact@v4
        with:
          name: sast-reports
          path: sast_reports
        continue-on-error: true

      - name: Download SCA reports
        uses: actions/download-artifact@v4
        with:
          name: sca-reports
          path: sca_reports
        continue-on-error: true

      - name: Post combined SAST + SCA comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const path = require('path');

            // ── Helper: parse Lambda response body ────────────────────
            function parseReport(filePath) {
              try {
                const raw  = fs.readFileSync(filePath, 'utf8');
                const data = JSON.parse(raw);
                return typeof data.body === 'string'
                  ? JSON.parse(data.body) : data.body;
              } catch (e) {
                console.log(`Parse error for ${filePath}: ${e.message}`);
                return null;
              }
            }

            // ── Severity icon ─────────────────────────────────────────
            function icon(sev) {
              const map = { CRITICAL:'🔴', HIGH:'🟠', MEDIUM:'🟡', LOW:'🟢', SAFE:'✅' };
              return map[sev] || '⚪';
            }

            let comment = '# 🛡️ AI Security Scan Report\n\n';
            let anyCritical = false;
            let totalSast   = 0;
            let totalSca    = 0;

            // ════════════════════════════════════════════════════
            // SECTION 1 — SAST Results
            // ════════════════════════════════════════════════════
            comment += '## 🔍 SAST — Static Code Analysis\n\n';

            const sastDir = 'sast_reports';
            let sastFiles = [];
            try { sastFiles = fs.readdirSync(sastDir); } catch(e) {}

            if (sastFiles.length === 0) {
              comment += '_No Java files changed in this PR._\n\n';
            } else {
              for (const f of sastFiles) {
                const body = parseReport(path.join(sastDir, f));
                if (!body) continue;

                if (body.has_critical) anyCritical = true;
                totalSast += body.finding_count || 0;

                comment += `### 📄 \`${body.filename}\`\n`;

                if (body.findings && body.findings.length > 0) {
                  comment += `| # | Severity | Type | Lines | Confidence |\n`;
                  comment += `|---|---|---|---|---|\n`;
                  body.findings.forEach((f, i) => {
                    comment += `| ${i+1} `;
                    comment += `| ${icon(f.severity)} ${f.severity} `;
                    comment += `| \`${f.label}\` `;
                    comment += `| ${f.line_range} `;
                    comment += `| ${(f.confidence * 100).toFixed(1)}% |\n`;
                  });
                  comment += '\n';
                  body.findings.forEach(f => {
                    comment += `> **${f.label} fix:** ${f.remediation}\n\n`;
                  });
                } else {
                  comment += '✅ No vulnerabilities found.\n\n';
                }
              }
            }

            // ════════════════════════════════════════════════════
            // SECTION 2 — SCA Results
            // ════════════════════════════════════════════════════
            comment += '---\n\n';
            comment += '## 📦 SCA — Dependency Analysis (NVD)\n\n';

            const scaDir = 'sca_reports';
            let scaFiles = [];
            try { scaFiles = fs.readdirSync(scaDir); } catch(e) {}

            if (scaFiles.length === 0) {
              comment += '_No pom.xml found in this repository._\n\n';
            } else {
              for (const f of scaFiles) {
                const body = parseReport(path.join(scaDir, f));
                if (!body) continue;

                if (body.has_critical) anyCritical = true;
                totalSca += body.vulnerable_count || 0;

                comment += `### 📋 \`pom.xml\` — ${body.total_dependencies} dependencies scanned\n\n`;

                if (body.findings && body.findings.length > 0) {
                  comment += `| # | Severity | Artifact | Version | CVE | CVSS |\n`;
                  comment += `|---|---|---|---|---|---|\n`;
                  body.findings.forEach((f, i) => {
                    comment += `| ${i+1} `;
                    comment += `| ${icon(f.severity)} ${f.severity} `;
                    comment += `| \`${f.artifact}\` `;
                    comment += `| ${f.version} `;
                    comment += `| [${f.top_cve}](https://nvd.nist.gov/vuln/detail/${f.top_cve}) `;
                    comment += `| ${f.cvss_score} |\n`;
                  });
                  comment += '\n';
                  body.findings.forEach(f => {
                    comment += `> **${f.artifact}:** ${f.description.slice(0, 150)}...\n`;
                    comment += `> **Fix:** ${f.remediation}\n\n`;
                  });
                } else {
                  comment += '✅ No vulnerable dependencies found.\n\n';
                }

                if (body.safe_deps && body.safe_deps.length > 0) {
                  comment += `<details>\n<summary>✅ ${body.safe_deps.length} safe dependencies</summary>\n\n`;
                  body.safe_deps.forEach(d => {
                    comment += `- \`${d.artifact}\` @ ${d.version}\n`;
                  });
                  comment += '\n</details>\n\n';
                }
              }
            }

            // ════════════════════════════════════════════════════
            // SECTION 3 — Summary
            // ════════════════════════════════════════════════════
            comment += '---\n\n';
            comment += '## 📊 Summary\n\n';
            comment += `| Category | Findings |\n`;
            comment += `|---|---|\n`;
            comment += `| 🔍 SAST vulnerabilities | ${totalSast} |\n`;
            comment += `| 📦 SCA vulnerable deps  | ${totalSca} |\n`;
            comment += `| **Total** | **${totalSast + totalSca}** |\n\n`;

            if (anyCritical) {
              comment += '## ❌ Build Blocked\n';
              comment += 'CRITICAL vulnerabilities detected. Fix before merging.\n';
            } else if (totalSast + totalSca > 0) {
              comment += '## ⚠️ Warnings Found\n';
              comment += 'No CRITICAL issues but review findings above.\n';
            } else {
              comment += '## ✅ All Clear\n';
              comment += 'No vulnerabilities detected. Safe to merge.\n';
            }

            comment += `\n_Scan run: [#${context.runNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;

            // ── Post comment ──────────────────────────────────────
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         comment,
            });

            console.log('✅ PR comment posted successfully');

            // ── Fail job if critical ───────────────────────────────
            if (anyCritical) {
              core.setFailed('CRITICAL vulnerabilities found — merge blocked');
            }
