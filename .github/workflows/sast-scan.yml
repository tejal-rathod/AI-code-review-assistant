name: AI SAST + SCA Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sast-ml-scanner-repo
  LAMBDA_FUNCTION: sast-ml-scanner-fn

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify Docker build files
        run: |
          echo "Repository structure:"
          find . -maxdepth 3 -type f | sort
          test -f api/Dockerfile
          test -f api/lambda_handler.py
          test -f models/sast_pipeline.joblib || {
            echo "::error::models/sast_pipeline.joblib was not found."
            echo "Expected path: ./models/sast_pipeline.joblib"
            exit 1
          }

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Building Docker image..."
          docker build \
            --file ./api/Dockerfile \
            --tag "${IMAGE_URI}" \
            .

          echo "Pushing ${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          docker tag "${IMAGE_URI}" "${LATEST_IMAGE}"
          docker push "${LATEST_IMAGE}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION}" \
            --image-uri "${{ steps.build.outputs.image_uri }}"

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION}"

  sast-scan:
    name: SAST - Scan Java Files
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get changed Java files
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only \
              "origin/${{ github.base_ref }}...HEAD" \
              | grep '\.java$' > sast_files.txt || true
          else
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only \
                "${{ github.event.before }}" "${{ github.sha }}" \
                | grep '\.java$' > sast_files.txt || true
            else
              git diff --name-only HEAD~1 HEAD \
                | grep '\.java$' > sast_files.txt || true
            fi
          fi

          COUNT=$(wc -l < sast_files.txt | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          cat sast_files.txt || true

      - name: Scan each Java file via Lambda
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sast_reports
          FAIL=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue

            CONTENT=$(jq -Rs . < "$file")
            PAYLOAD=$(jq -n \
              --arg fn "$file" \
              --argjson content "$CONTENT" \
              '{mode:"file", filename:$fn, content:$content}')

            SAFE_NAME=$(echo "$file" | tr '/' '_' | sed 's/^_//')

            aws lambda invoke \
              --function-name "${LAMBDA_FUNCTION}" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              "sast_reports/${SAFE_NAME}.json"

            CRITICAL=$(jq -r \
              '.body | if type == "string" then fromjson else . end | .has_critical' \
              "sast_reports/${SAFE_NAME}.json" 2>/dev/null || echo "false")

            if [ "$CRITICAL" = "true" ]; then
              echo "::error file=$file::CRITICAL vulnerability found"
              FAIL=1
            fi
          done < sast_files.txt

          exit "$FAIL"

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: sast_reports/
          if-no-files-found: ignore

  sca-scan:
    name: SCA - Scan pom.xml Dependencies
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find pom.xml files
        id: pom
        shell: bash
        run: |
          find . -name "pom.xml" \
            -not -path "./.git/*" \
            -not -path "*/target/*" > pom_files.txt || true

          COUNT=$(wc -l < pom_files.txt | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          cat pom_files.txt || true

      - name: Scan each pom.xml via Lambda
        if: steps.pom.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sca_reports

          while IFS= read -r pom; do
            [ -z "$pom" ] && continue
            [ -f "$pom" ] || continue

            CONTENT=$(jq -Rs . < "$pom")
            PAYLOAD=$(jq -n \
              --arg fn "$pom" \
              --argjson content "$CONTENT" \
              '{mode:"sca", filename:$fn, content:$content}')

            SAFE_NAME=$(echo "$pom" | tr '/' '_' | sed 's/^_//')

            aws lambda invoke \
              --function-name "${LAMBDA_FUNCTION}" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              "sca_reports/${SAFE_NAME}.json"
          done < pom_files.txt

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: sca_reports/
          if-no-files-found: ignore

  post-pr-comment:
    name: Post PR Comment
    needs: [sast-scan, sca-scan]
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      (needs.sast-scan.result == 'success' || needs.sast-scan.result == 'failure') &&
      (needs.sca-scan.result == 'success' || needs.sca-scan.result == 'failure')

    steps:
      - name: Download SAST reports
        uses: actions/download-artifact@v4
        with:
          name: sast-reports
          path: sast_reports
        continue-on-error: true

      - name: Download SCA reports
        uses: actions/download-artifact@v4
        with:
          name: sca-reports
          path: sca_reports
        continue-on-error: true

      - name: Post combined SAST + SCA comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            function parseReport(filePath) {
              try {
                const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                return typeof data.body === 'string'
                  ? JSON.parse(data.body)
                  : data.body;
              } catch (e) {
                console.log(`Parse error for ${filePath}: ${e.message}`);
                return null;
              }
            }

            function icon(severity) {
              const icons = {
                CRITICAL: '🔴',
                HIGH: '🟠',
                MEDIUM: '🟡',
                LOW: '🟢',
                SAFE: '✅'
              };
              return icons[severity] || '⚪';
            }

            let comment = '# 🛡️ AI Security Scan Report\n\n';
            let anyCritical = false;
            let totalSast = 0;
            let totalSca = 0;

            comment += '## 🔍 SAST - Static Code Analysis\n\n';
            let sastFiles = [];
            try { sastFiles = fs.readdirSync('sast_reports'); } catch (_) {}

            if (sastFiles.length === 0) {
              comment += '_No Java files were scanned._\n\n';
            } else {
              for (const file of sastFiles) {
                const body = parseReport(path.join('sast_reports', file));
                if (!body) continue;

                anyCritical ||= Boolean(body.has_critical);
                totalSast += Number(body.finding_count || 0);

                comment += `### 📄 \`${body.filename || file}\`\n`;
                const findings = body.findings || [];

                if (findings.length === 0) {
                  comment += '✅ No vulnerabilities found.\n\n';
                  continue;
                }

                comment += '| # | Severity | Type | Lines | Confidence |\n';
                comment += '|---|---|---|---|---|\n';

                findings.forEach((finding, index) => {
                  const confidence = Number(finding.confidence || 0) * 100;
                  comment += `| ${index + 1} | ${icon(finding.severity)} ${finding.severity} | \`${finding.label || 'Unknown'}\` | ${finding.line_range || '-'} | ${confidence.toFixed(1)}% |\n`;
                });

                comment += '\n';
              }
            }

            comment += '---\n\n## 📦 SCA - Dependency Analysis\n\n';
            let scaFiles = [];
            try { scaFiles = fs.readdirSync('sca_reports'); } catch (_) {}

            if (scaFiles.length === 0) {
              comment += '_No dependency reports were generated._\n\n';
            } else {
              for (const file of scaFiles) {
                const body = parseReport(path.join('sca_reports', file));
                if (!body) continue;

                anyCritical ||= Boolean(body.has_critical);
                totalSca += Number(body.vulnerable_count || body.finding_count || 0);

                comment += `### 📋 ${body.filename || 'pom.xml'}\n\n`;
                const findings = body.findings || [];

                if (findings.length === 0) {
                  comment += '✅ No vulnerable dependencies found.\n\n';
                  continue;
                }

                comment += '| # | Severity | Artifact | Version | CVE | CVSS |\n';
                comment += '|---|---|---|---|---|---|\n';

                findings.forEach((finding, index) => {
                  comment += `| ${index + 1} | ${icon(finding.severity)} ${finding.severity} | \`${finding.artifact || '-'}\` | ${finding.version || '-'} | ${finding.top_cve || '-'} | ${finding.cvss_score || '-'} |\n`;
                });

                comment += '\n';
              }
            }

            comment += '---\n\n## 📊 Summary\n\n';
            comment += '| Category | Findings |\n|---|---|\n';
            comment += `| 🔍 SAST | ${totalSast} |\n`;
            comment += `| 📦 SCA | ${totalSca} |\n`;
            comment += `| **Total** | **${totalSast + totalSca}** |\n\n`;

            if (anyCritical) {
              comment += '## ❌ Build Blocked\nCRITICAL vulnerabilities detected. Fix before merging.\n';
            } else if (totalSast + totalSca > 0) {
              comment += '## ⚠️ Warnings Found\nReview the findings above.\n';
            } else {
              comment += '## ✅ All Clear\nNo vulnerabilities detected.\n';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  fail-on-critical:
    name: Fail if Critical Findings Exist
    needs: [sast-scan, sca-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download SAST reports
        uses: actions/download-artifact@v4
        with:
          name: sast-reports
          path: sast_reports
        continue-on-error: true

      - name: Download SCA reports
        uses: actions/download-artifact@v4
        with:
          name: sca-reports
          path: sca_reports
        continue-on-error: true

      - name: Fail on critical findings
        shell: bash
        run: |
          set -euo pipefail
          CRITICAL=false

          shopt -s nullglob

          for file in sast_reports/*.json sca_reports/*.json; do
            VALUE=$(jq -r \
              '.body | if type == "string" then fromjson else . end | .has_critical' \
              "$file" 2>/dev/null || echo "false")

            if [ "$VALUE" = "true" ]; then
              CRITICAL=true
            fi
          done

          if [ "$CRITICAL" = "true" ]; then
            echo "❌ CRITICAL vulnerabilities found"
            exit 1
          fi

          echo "✅ No critical vulnerabilities found"
