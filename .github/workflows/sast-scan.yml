name: AI SAST Security Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sast-ml-scanner-repo
  LAMBDA_FUNCTION: sast-ml-scanner-fn

permissions:
  contents: read

jobs:

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # Configure AWS using IAM User Access Keys
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify which AWS identity is being used
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -e

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Building Docker image..."

          docker build \
            -t "${IMAGE_URI}" \
            ./api

          echo "Pushing image: ${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          echo "Tagging latest image..."
          docker tag "${IMAGE_URI}" "${LATEST_IMAGE}"

          echo "Pushing latest image..."
          docker push "${LATEST_IMAGE}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function
        run: |
          set -e

          echo "Updating Lambda with new Docker image..."

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION}" \
            --image-uri "${{ steps.build.outputs.image_uri }}"

          echo "Waiting for Lambda update..."

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION}"


  scan-changed-files:
    name: Scan Changed Java Files
    needs: build-and-deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Configure AWS using IAM User Access Keys
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Get changed Java files
        id: changed
        shell: bash
        run: |
          set -e

          # For Pull Requests
          if [ "${{ github.event_name }}" = "pull_request" ]; then

            git diff \
              --name-only \
              "origin/${{ github.base_ref }}...HEAD" \
              | grep '\.java$' > changed_files.txt || true

          # For Push events
          else

            git diff \
              --name-only \
              HEAD~1 HEAD \
              | grep '\.java$' > changed_files.txt || true

          fi

          COUNT=$(wc -l < changed_files.txt | tr -d ' ')

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          echo "Changed Java files:"
          cat changed_files.txt || true


      - name: Scan each changed file via Lambda
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          set -e

          mkdir -p reports

          FAIL=0

          while IFS= read -r file; do

            [ -z "$file" ] && continue

            echo "Scanning: $file"

            if [ ! -f "$file" ]; then
              echo "File not found: $file"
              continue
            fi

            CONTENT=$(jq -Rs . < "$file")

            PAYLOAD=$(jq -n \
              --arg fn "$file" \
              --argjson content "$CONTENT" \
              '{
                mode: "file",
                filename: $fn,
                content: $content
              }')

            REPORT_FILE="reports/$(basename "$file").json"

            aws lambda invoke \
              --function-name "${LAMBDA_FUNCTION}" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              "$REPORT_FILE"

            CRITICAL=$(jq -r \
              '.body | fromjson | .has_critical' \
              "$REPORT_FILE" 2>/dev/null || echo "false")

            if [ "$CRITICAL" = "true" ]; then
              echo "::error file=$file::CRITICAL vulnerability found"
              FAIL=1
            fi

          done < changed_files.txt

          exit $FAIL


      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-scan-reports
          path: reports/
          if-no-files-found: ignore


      - name: Upload reports to S3
        if: always()
        run: |
          if [ -d "reports" ]; then

            aws s3 cp \
              reports/ \
              "s3://sast-ml-scanner-reports-716393851217/${GITHUB_RUN_ID}/" \
              --recursive

          else
            echo "No reports found to upload."
          fi


      - name: Comment findings on Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('reports')) {
              console.log('No reports directory found');
              return;
            }

            const files = fs.readdirSync('reports');

            if (files.length === 0) {
              console.log('No scan reports found');
              return;
            }

            let comment = '## 🛡️ AI SAST Scan Results\n\n';
            let anyCritical = false;

            for (const file of files) {
              try {
                const data = JSON.parse(
                  fs.readFileSync(`reports/${file}`, 'utf8')
                );

                const body = JSON.parse(data.body);

                if (body.has_critical) {
                  anyCritical = true;
                }

                comment += `### ${body.filename}\n`;
                comment += `Findings: ${body.finding_count}\n`;

                for (const finding of body.findings || []) {
                  comment +=
                    `- **${finding.label}** ` +
                    `(${finding.severity}) — ` +
                    `lines ${finding.line_range}, ` +
                    `confidence ${(finding.confidence * 100).toFixed(1)}%\n`;
                }

                comment += '\n';

              } catch (error) {
                console.log(`Could not parse ${file}:`, error);
              }
            }

            comment += anyCritical
              ? '\n❌ **Build blocked — CRITICAL vulnerabilities found.**'
              : '\n✅ **No critical issues found.**';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
