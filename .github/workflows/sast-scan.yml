name: AI SAST Security Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sast-ml-scanner-repo
  LAMBDA_FUNCTION: sast-ml-scanner-fn

permissions:
  contents: read

jobs:

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # Configure AWS using IAM User Access Keys
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify which AWS identity is being used
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -e

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Building Docker image..."

          docker build \
            -t "${IMAGE_URI}" \
            ./api

          echo "Pushing image: ${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          echo "Tagging latest image..."
          docker tag "${IMAGE_URI}" "${LATEST_IMAGE}"

          echo "Pushing latest image..."
          docker push "${LATEST_IMAGE}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function
        run: |
          set -e

          echo "Updating Lambda with new Docker image..."

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION}" \
            --image-uri "${{ steps.build.outputs.image_uri }}"

          echo "Waiting for Lambda update..."

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION}"


  scan-changed-files:
    name: Scan Changed Java Files
    needs: build-and-deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Configure AWS using IAM User Access Keys
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Get changed Java files
        id: changed
        shell: bash
        run: |
          set -e

          # For Pull Requests
          if [ "${{ github.event_name }}" = "pull_request" ]; then

            git diff \
              --name-only \
              "origin/${{ github.base_ref }}...HEAD" \
              | grep '\.java$' > changed_files.txt || true

          # For Push events
          else

            git diff \
              --name-only \
              HEAD~1 HEAD \
              | grep '\.java$' > changed_files.txt || true

          fi

          COUNT=$(wc -l < changed_files.txt | tr -d ' ')

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          echo "Changed Java files:"
          cat changed_files.txt || true


      - name: Scan each changed file via Lambda
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          set -e

          mkdir -p reports

          FAIL=0

          while IFS= read -r file; do

            [ -z "$file" ] && continue

            echo "Scanning: $file"

            if [ ! -f "$file" ]; then
              echo "File not found: $file"
              continue
            fi

            CONTENT=$(jq -Rs . < "$file")

            PAYLOAD=$(jq -n \
              --arg fn "$file" \
              --argjson content "$CONTENT" \
              '{
                mode: "file",
                filename: $fn,
                content: $content
              }')

            REPORT_FILE="reports/$(basename "$file").json"

            aws lambda invoke \
              --function-name "${LAMBDA_FUNCTION}" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              "$REPORT_FILE"

            CRITICAL=$(jq -r \
              '.body | fromjson | .has_critical' \
              "$REPORT_FILE" 2>/dev/null || echo "false")

            if [ "$CRITICAL" = "true" ]; then
              echo "::error file=$file::CRITICAL vulnerability found"
              FAIL=1
            fi

          done < changed_files.txt

          exit $FAIL


      - name: Scan Maven dependencies via Lambda
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p sca_reports
          find . -name "pom.xml" -not -path "./.git/*" -not -path "*/target/*" > pom_files.txt || true

          while IFS= read -r pom; do
            [ -z "$pom" ] && continue
            [ ! -f "$pom" ] && continue

            echo "Scanning dependencies: $pom"
            CONTENT=$(jq -Rs . < "$pom")
            PAYLOAD=$(jq -n \
              --arg fn "$pom" \
              --argjson content "$CONTENT" \
              '{mode:"sca", filename:$fn, content:$content}')

            SAFE_NAME=$(echo "$pom" | tr '/' '_' | sed 's/^_//')

            aws lambda invoke \
              --function-name "${LAMBDA_FUNCTION}" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              "sca_reports/${SAFE_NAME}.json"
          done < pom_files.txt

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-scan-reports
          path: reports/
          if-no-files-found: ignore

      - name: Upload SCA reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-scan-reports
          path: sca_reports/
          if-no-files-found: ignore


      - name: Upload reports to S3
        if: always()
        run: |
          if [ -d "reports" ]; then

            aws s3 cp \
              reports/ \
              "s3://sast-ml-scanner-reports-716393851217/${GITHUB_RUN_ID}/" \
              --recursive

          else
            echo "No reports found to upload."
          fi


      - name: Comment findings on Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          LAMBDA_FUNCTION: ${{ env.LAMBDA_FUNCTION }}
        with:
          script: |
            const fs = require('fs');

            function parseReport(file) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                return typeof data.body === 'string' ? JSON.parse(data.body) : data.body;
              } catch (e) {
                console.log(`Could not parse ${file}: ${e.message}`);
                return null;
              }
            }

            function icon(severity) {
              return {
                CRITICAL: '🔴',
                HIGH: '🟠',
                MEDIUM: '🟡',
                LOW: '🟢'
              }[severity] || '⚪';
            }

            let comment = '# 🛡️ AI Security Scan Results\n\n';
            comment += '## 🤖 AI / ML Model\n\n';
            comment += '| Property | Value |\n|---|---|\n';
            comment += '| Model | `sast_pipeline.joblib` |\n';
            comment += '| Scan Engine | AI SAST Lambda |\n';
            comment += `| Lambda Function | \`${process.env.LAMBDA_FUNCTION || 'sast-ml-scanner-fn'}\` |\n`;
            comment += '| Status | Executed |\n\n';

            let anyCritical = false;
            let totalSast = 0;
            let totalSca = 0;

            comment += '---\n\n## 🔍 SAST - Static Code Analysis\n\n';
            let files = fs.existsSync('reports')
              ? fs.readdirSync('reports').filter(f => f.endsWith('.json'))
              : [];

            if (!files.length) {
              comment += '_No SAST reports generated._\n\n';
            }

            for (const f of files) {
              const body = parseReport(`reports/${f}`);
              if (!body) continue;

              const findings = body.findings || [];
              const count = Number(body.finding_count || findings.length || 0);
              totalSast += count;
              anyCritical ||= Boolean(body.has_critical);

              comment += `### 📄 \`${body.filename || f}\`\n\n`;

              if (!findings.length) {
                comment += '✅ No vulnerabilities found.\n\n';
                continue;
              }

              comment += '| Severity | Finding | Lines | Confidence |\n';
              comment += '|---|---|---|---|\n';

              for (const finding of findings) {
                const confidence = (Number(finding.confidence || 0) * 100).toFixed(1);
                comment += `| ${icon(finding.severity)} ${finding.severity || '-'} | \`${finding.label || '-'}\` | ${finding.line_range || '-'} | ${confidence}% |\n`;
              }
              comment += '\n';
            }

            comment += '---\n\n## 📦 SCA - Dependency Analysis\n\n';
            let scaFiles = fs.existsSync('sca_reports')
              ? fs.readdirSync('sca_reports').filter(f => f.endsWith('.json'))
              : [];

            if (!scaFiles.length) {
              comment += '_No SCA reports generated._\n\n';
            }

            for (const f of scaFiles) {
              const body = parseReport(`sca_reports/${f}`);
              if (!body) continue;

              const findings = body.findings || [];
              totalSca += Number(body.finding_count || body.vulnerable_count || findings.length || 0);
              anyCritical ||= Boolean(body.has_critical);

              comment += `### 📋 \`${body.filename || f}\`\n\n`;

              if (!findings.length) {
                comment += '✅ No vulnerable dependencies found.\n\n';
                continue;
              }

              comment += '| Severity | Dependency | Version | CVE | CVSS |\n';
              comment += '|---|---|---|---|---|\n';

              for (const finding of findings) {
                comment += `| ${icon(finding.severity)} ${finding.severity || '-'} | \`${finding.artifact || finding.label || '-'}\` | ${finding.version || '-'} | ${finding.top_cve || finding.cve || '-'} | ${finding.cvss_score || '-'} |\n`;
              }
              comment += '\n';
            }

            comment += '---\n\n## 📊 Security Summary\n\n';
            comment += '| Scan | Findings |\n|---|---:|\n';
            comment += `| 🔍 AI SAST | ${totalSast} |\n`;
            comment += `| 📦 SCA | ${totalSca} |\n`;
            comment += `| **Total** | **${totalSast + totalSca}** |\n\n`;

            comment += anyCritical
              ? '## ❌ Build Blocked\n\n**CRITICAL vulnerabilities were detected. Please fix them before merging.**\n'
              : (totalSast + totalSca > 0
                  ? '## ⚠️ Findings Detected\n\nPlease review the findings above before merging.\n'
                  : '## ✅ Security Scan Passed\n\nNo vulnerabilities were detected.\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
